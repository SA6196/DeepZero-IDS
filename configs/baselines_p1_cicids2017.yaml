# Protocol P1: Leave-One-Family-Out evaluation for Classical Baselines and Autoencoders
# Source: SPEC.md Section 3, 4, 5 & User Request STEP 1, STEP 2
# "DEV DATA, NOT FOR REPORTED RESULTS"

experiment:
  name: "p1_lofo_baselines_and_autoencoders"
  seed: 0
  status: "DEV DATA, NOT FOR REPORTED RESULTS"
  device: "cpu"
  max_threads: 4

dataset:
  name: "cicids2017_cleaned_dev"
  cleaned_path: "data/processed/cicids2017_cleaned_dev.parquet"
  schema_config: "configs/schema_cicids2017.yaml"
  attack_family_config: "configs/attack_families_cicids2017.yaml"

protocol:
  name: "P1"
  val_benign_ratio: 0.2
  test_benign_ratio: 0.2
  target_families:
    - "DoS/DDoS"
    - "PortScan"
    - "BruteForce"
    - "WebAttack"
    - "Botnet"
    - "Infiltration"

preprocessing:
  skew_threshold: 3.0
  sentinel_columns:
    - "Init_Win_bytes_forward"
    - "Init_Win_bytes_backward"

speed_caps:
  # Maximum benign TRAIN samples per model (seeded and nested)
  train_rows:
    isolation_forest: 200000
    pca: 200000
    lof: 50000
    ocsvm: 20000
    autoencoder: 500000
    vae: 500000
  # STEP 1: Remove TEST benign cap -> score ALL test benign rows (~427k)
  test_benign_rows: null

models:
  isolation_forest:
    n_estimators: 100
    max_samples: "auto"
    contamination: "auto"
    random_state: 0
    n_jobs: 4

  ocsvm:
    kernel: "rbf"
    gamma: "scale"
    nu: 0.05

  lof:
    n_neighbors: 20
    novelty: true
    n_jobs: 4

  pca:
    n_components: 16
    random_state: 0

  autoencoder:
    hidden_dims: [64, 32]
    bottleneck_dim: 16
    lr: 0.001
    batch_size: 1024
    max_epochs: 30
    patience: 3

  vae:
    hidden_dims: [64, 32]
    latent_dim: 16
    lr: 0.001
    batch_size: 1024
    max_epochs: 30
    patience: 3

output:
  results_dir: "results"
  models_dir: "results/models"
